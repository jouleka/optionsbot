[project]
name = "optionsbot"
version = "0.0.1"
description = "IBKR options analysis and alert tool (paper trading)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jurgen", email = "58989038+jouleka@users.noreply.github.com" }]

dependencies = [
    "pydantic-settings>=2.5",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "ib_async>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "mcp>=1.13",
    "APScheduler>=3.11",
    "pandas-market-calendars>=5.4",
    "httpx>=0.28",
    "structlog>=24.0",
]

[project.scripts]
optionsbot = "optionsbot.cli:app"
optionsbot-mcp = "optionsbot.mcp_server.__main__:main"
optionsbot-daemon = "optionsbot.daemon.__main__:main"
optionsbot-fred-mcp = "optionsbot.market_context.__main__:fred_main"
optionsbot-finnhub-mcp = "optionsbot.market_context.__main__:finnhub_main"
optionsbot-event = "optionsbot.daemon.event_webhook:main"
optionsbot-rth-acceptance = "optionsbot.daemon.rth_acceptance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionsbot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic version files are autogenerated and don't follow project style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["optionsbot"]

# APScheduler and pandas-market-calendars ship no py.typed marker or stubs;
# ignore missing imports globally for these packages rather than per-call-site.
[[tool.mypy.overrides]]
module = ["apscheduler.*", "pandas_market_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q -m 'not live'"
markers = [
    "live: requires a running paper IB Gateway on the configured port; excluded by default",
]
asyncio_mode = "auto"
